<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Notes de Service — Afrijet Sahara</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5F3EF">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NDS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1a1a2e;
    --off-white:#F5F3EF;
    --white:#FFFFFF;
    --bordeaux:#8B0000;
    --red:#E8001C;
    --line: rgba(26,26,46,0.14);
    --line-doc: rgba(26,26,46,0.14);
    --muted: rgba(26,26,46,0.55);
    --muted-soft: rgba(26,26,46,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--off-white);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--red);color:#fff;}

  /* ---------- Top bar ---------- */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;
    background:var(--white);
    border-bottom:1px solid var(--line-doc);
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .name{font-weight:600;font-size:15px;letter-spacing:0.01em;color:var(--ink);}
  .brand .sub{font-size:12px;color:var(--muted);}
  .topbar nav{display:flex;gap:8px;}
  .topbar button{
    background:transparent;border:1px solid var(--line-doc);color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;
    padding:8px 16px;border-radius:2px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
  }
  .topbar button:hover{border-color:var(--red);color:var(--red);}
  .topbar button.active{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff;}

  /* ---------- Layout ---------- */
  main{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:0;
    min-height:calc(100vh - 66px);
  }
  @media (max-width:900px){
    main{grid-template-columns:1fr;}
  }

  aside{
    background:var(--white);
    border-right:1px solid var(--line-doc);
    padding:26px 24px 60px;
    display:flex;flex-direction:column;gap:22px;
  }
  aside h2{
    font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--muted);font-weight:600;margin:0 0 10px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12.5px;color:var(--muted);}
  .field input[type=text], .field textarea, .field select{
    background:var(--off-white);
    border:1px solid var(--line-doc);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    padding:9px 10px;
    border-radius:2px;
    resize:vertical;
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{
    outline:none;border-color:var(--red);
  }
  .field textarea{min-height:70px;line-height:1.4;}

  .check-list{display:flex;flex-direction:column;gap:2px;}
  .check-item{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    font-size:13px;padding:7px 2px;user-select:none;color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .check-item .box{
    width:17px;height:17px;flex:0 0 17px;
    border:1.5px solid rgba(26,26,46,0.35);border-radius:2px;
    background:var(--white);
    position:relative;transition:background .12s,border-color .12s;
  }
  .check-item.checked .box{background:var(--red);border-color:var(--red);}
  .check-item.checked .box::after{
    content:'';position:absolute;left:5px;top:1.5px;
    width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .check-item span.txt{flex:1;}
  .field input#toCustom{margin-top:6px;}

  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .cat-btn{
    border:1px solid var(--line-doc);background:var(--off-white);
    color:var(--ink);padding:10px 8px;border-radius:2px;
    font-family:'IBM Plex Sans',sans-serif;font-size:12px;text-align:left;
    cursor:pointer;line-height:1.3;transition:border-color .15s,background .15s,color .15s;
  }
  .cat-btn strong{display:block;font-size:12.5px;margin-bottom:2px;}
  .cat-btn small{color:var(--muted);font-size:10.5px;}
  .cat-btn:hover{border-color:rgba(232,0,28,0.6);}
  .cat-btn.selected{background:var(--bordeaux);border-color:var(--bordeaux);color:#fff;}
  .cat-btn.selected small{color:rgba(255,255,255,0.75);}

  .btn-primary{
    background:var(--red);color:#fff;border:none;
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;
    padding:13px 18px;border-radius:2px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:hover{background:#c40017;}
  .btn-primary:disabled{background:rgba(232,0,28,0.35);cursor:default;}
  .btn-secondary{
    background:transparent;border:1px solid var(--line-doc);color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;
    padding:10px 14px;border-radius:2px;cursor:pointer;
  }
  .btn-secondary:hover{border-color:var(--ink);}

  .spinner{
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Document workspace ---------- */
  .workspace{
    padding:44px 40px 80px;
    display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;
    background:var(--off-white);
  }
  .sheet{
    background:var(--white);
    color:var(--ink);
    width:100%;max-width:760px;
    padding:52px 56px 60px;
    font-family:'Source Serif 4',serif;
    box-shadow:0 18px 40px -22px rgba(26,26,46,0.35);
    border:1px solid var(--line-doc);
    min-height:960px;
  }
  @media (max-width:700px){
    .workspace{padding:20px 14px 60px;}
    .sheet{padding:26px 18px 34px;min-height:auto;}
    .doc-title .t1{font-size:16px;}
    .meta-table{font-size:11px;}
    .sheet-head{font-size:9px;flex-direction:column;gap:4px;}
  }
  .sheet-head{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:10.5px;color:var(--muted);
    display:flex;justify-content:space-between;
    border-bottom:1px solid var(--line-doc);
    padding-bottom:8px;margin-bottom:26px;
    line-height:1.5;
  }
  .sheet-head b{color:var(--ink);}
  .doc-title{text-align:center;margin-bottom:22px;}
  .doc-title .t1{
    font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:20px;
    letter-spacing:0.04em;margin:0 0 4px;
  }
  .doc-title .t2{
    font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:10.5px;
    color:var(--muted);
  }
  .meta-table{
    width:100%;border-collapse:collapse;
    font-family:'IBM Plex Sans',sans-serif;font-size:12px;
    border:1px solid var(--line-doc);margin-bottom:22px;
  }
  .meta-table td{
    border:1px solid var(--line-doc);padding:7px 10px;vertical-align:top;
  }
  .meta-table .k{
    color:var(--muted);font-size:10px;text-transform:uppercase;
    letter-spacing:0.04em;display:block;margin-bottom:2px;
  }
  .meta-table [contenteditable]:focus{outline:1px solid var(--red);background:var(--white);}

  .objet-block{margin-bottom:20px;}
  .objet-block .lbl{
    font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:12.5px;
    letter-spacing:0.03em;color:var(--ink);
  }
  .objet-block [contenteditable]{
    font-weight:600;font-size:15px;line-height:1.4;margin-top:4px;
  }

  .intro[contenteditable]{
    font-size:13.5px;line-height:1.65;text-align:justify;margin-bottom:26px;
  }

  .section-block{margin-bottom:20px;}
  .section-block h3{
    font-family:'IBM Plex Sans',sans-serif;font-weight:700;font-size:12.5px;
    text-transform:uppercase;letter-spacing:0.03em;color:var(--ink);
    margin:0 0 10px;
  }
  .section-block [contenteditable]{
    font-size:13.5px;line-height:1.7;white-space:pre-wrap;text-align:justify;
  }
  [contenteditable]:focus{outline:none;background:rgba(139,0,0,0.05);}

  .closing[contenteditable]{
    font-size:13px;line-height:1.6;margin:26px 0 34px;
    color:var(--ink);
  }

  .sign-block{
    display:flex;justify-content:space-between;
    font-family:'IBM Plex Sans',sans-serif;font-size:12px;
    margin-top:30px;
  }
  .sign-block div{width:46%;}
  .sign-block .role{color:var(--muted);font-size:11px;margin-top:4px;}

  .sheet-actions{
    display:flex;gap:10px;justify-content:center;margin:20px 0 0;
  }

  .empty-state{
    color:var(--muted-soft);font-size:14px;text-align:center;
    max-width:340px;margin:120px auto;line-height:1.6;
  }

  /* ---------- Archive ---------- */
  .archive-panel{padding:36px 40px 80px;max-width:920px;margin:0 auto;width:100%;background:var(--off-white);}
  .archive-search{
    width:100%;background:var(--white);border:1px solid var(--line-doc);
    color:var(--ink);padding:11px 14px;border-radius:2px;
    font-family:'IBM Plex Sans',sans-serif;font-size:14px;margin-bottom:22px;
  }
  .archive-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 14px;border-bottom:1px solid var(--line-doc);cursor:pointer;
    background:var(--white);margin-bottom:6px;border-radius:2px;
  }
  .archive-row:hover{border-color:var(--red);}
  .archive-row .ref{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--red);
    margin-bottom:3px;
  }
  .archive-row .obj{font-size:14.5px;font-weight:500;color:var(--ink);}
  .archive-row .meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .archive-row .actions{display:flex;gap:8px;}
  .archive-row .actions button{
    background:transparent;border:1px solid var(--line-doc);color:var(--muted);
    font-size:11.5px;padding:6px 10px;border-radius:2px;cursor:pointer;
  }
  .archive-row .actions button:hover{border-color:var(--red);color:var(--red);}
  .archive-empty{color:var(--muted-soft);text-align:center;padding:60px 0;font-size:14px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="name">Notes de Service</span>
    <span class="sub">Sahara Aviation SAS — Afrijet Sahara</span>
  </div>
  <nav>
    <button id="tabEditor" class="active">Rédaction</button>
    <button id="tabArchive">Archives</button>
  </nav>
</header>

<main>
  <aside id="editorAside">
    <div>
      <h2>Catégorie</h2>
      <div class="cat-grid" id="catGrid"></div>
    </div>

    <div class="field">
      <label>Sujet de la note</label>
      <textarea id="subjectInput" placeholder="Ex. Restriction des vols Dakhla–Nouakchott pour travaux de piste"></textarea>
    </div>

    <div class="field">
      <label>Points clés (optionnel)</label>
      <textarea id="keyPoints" placeholder="Éléments à intégrer impérativement, un par ligne"></textarea>
    </div>

    <div class="field">
      <label>Diffusion / À</label>
      <div class="check-list" id="diffusionList"></div>
      <input type="text" id="toCustom" placeholder="Autre destinataire (optionnel)">
    </div>

    <div class="field">
      <label>Référence</label>
      <input type="text" id="refInput">
    </div>

    <button class="btn-primary" id="generateBtn">Générer la note</button>
    <div id="genError" style="color:#ff8080;font-size:12px;display:none;"></div>
  </aside>

  <section class="workspace" id="workspace">
    <div class="empty-state" id="emptyState">
      Choisissez une catégorie, décrivez le sujet, puis générez la note. Le texte reste entièrement modifiable avant export.
    </div>
    <div class="sheet" id="sheet" style="display:none;"></div>
  </section>

  <section class="archive-panel" id="archivePanel" style="display:none;">
    <input class="archive-search" id="archiveSearch" placeholder="Rechercher par référence, sujet ou catégorie…">
    <div id="archiveList"></div>
  </section>
</main>

<script>
/* ---------------- Category skeletons ---------------- */
const CATEGORIES = [
  {
    id:'technique', label:'Technique / Maintenance', hint:'Moteur, cellule, systèmes',
    sections:['Contexte','Causes / Facteurs','Risques','Mesures d\u2019atténuation','Procédures applicables']
  },
  {
    id:'securite', label:'Sécurité des vols', hint:'Événement, consigne',
    sections:['Contexte','Constat / Événement','Analyse des causes','Actions correctives','Consignes applicables']
  },
  {
    id:'operationnel', label:'Opérationnel', hint:'Décision, procédure',
    sections:['Contexte','Objet de la décision','Modalités d\u2019application','Responsabilités','Date d\u2019entrée en vigueur']
  },
  {
    id:'rh', label:'RH / Administratif', hint:'Personnel, organisation',
    sections:['Contexte','Décision','Modalités pratiques','Personnel concerné','Contact / Questions']
  }
];

const STYLE_REFERENCE = `Registre : note de service aéronautique interne, rigoureuse, factuelle, rédigée à la troisième personne ou à l'impératif de consigne. Vocabulaire technique précis (aviation, EASA/ICAO le cas échéant). Phrases construites, paragraphes courts, puces "•" pour les énumérations. Aucune familiarité. Chaque section doit être autonome et actionnable pour un équipage ou un service. La société est Sahara Aviation SAS — Afrijet Sahara, basée à Dakhla, Maroc.

PARC AÉRIEN — RÈGLE STRICTE : la flotte exploitée est l'Embraer EMB-140 LR, équipé de moteurs Rolls-Royce AE3007. Toute mention d'appareil, de moteur, de type de cellule ou de caractéristique technique (compresseur, ITT/EGT, capacité, etc.) doit obligatoirement se référer à cette configuration exacte : EMB-140 LR / AE3007. N'invente et ne mentionne aucun autre type d'appareil (pas d'EMB-145, pas d'autre motorisation) sauf si le sujet fourni par l'utilisateur le nomme explicitement autrement.`;

let state = {
  category: null,
  ref: '',
  date: '',
  from: 'Direction des Opérations Aériennes',
  to: '',
  classification: 'Diffusion interne',
  revision: '01',
  objet: '',
  intro: '',
  sections: [],
  closing: 'Cette note de service est applicable dès diffusion et doit être portée à la connaissance du personnel concerné. Toute question ou retour d\u2019expérience relatif à son application est à adresser à la Direction des Opérations Aériennes.'
};

/* ---------------- Reference counter ---------------- */
function nextRef(){
  const year = new Date().getFullYear();
  let counter = parseInt(localStorage.getItem('ns:counter') || '15', 10);
  const ref = `NS-OPS-${year}-${String(counter).padStart(3,'0')}`;
  return ref;
}
function commitRefCounter(){
  let counter = parseInt(localStorage.getItem('ns:counter') || '15', 10);
  localStorage.setItem('ns:counter', String(counter + 1));
}

/* ---------------- UI: category grid ---------------- */
const catGrid = document.getElementById('catGrid');
CATEGORIES.forEach(cat=>{
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.innerHTML = `<strong>${cat.label}</strong><small>${cat.hint}</small>`;
  btn.onclick = ()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    state.category = cat;
  };
  catGrid.appendChild(btn);
});

document.getElementById('refInput').value = nextRef();

/* ---------------- Diffusion checklist (custom, non-native) ---------------- */
const DIFFUSION_OPTIONS = [
  'Ensemble des Pilotes (PNT)',
  'Encadrement Opérations',
  'Maintenance / Technique',
  'Personnel Navigant Commercial (PNC)',
  'Direction Générale',
  'RH / Administration',
  'Ensemble du personnel'
];
const diffusionSelected = new Set(['Ensemble des Pilotes (PNT)', 'Encadrement Opérations']);

const diffusionList = document.getElementById('diffusionList');
DIFFUSION_OPTIONS.forEach(opt=>{
  const row = document.createElement('div');
  row.className = 'check-item' + (diffusionSelected.has(opt) ? ' checked' : '');
  row.innerHTML = `<span class="box"></span><span class="txt">${opt}</span>`;
  row.onclick = ()=>{
    if(diffusionSelected.has(opt)){ diffusionSelected.delete(opt); row.classList.remove('checked'); }
    else { diffusionSelected.add(opt); row.classList.add('checked'); }
  };
  diffusionList.appendChild(row);
});

function computeTo(){
  const custom = document.getElementById('toCustom').value.trim();
  const parts = [...diffusionSelected];
  if(custom) parts.push(custom);
  return parts.join(', ');
}

/* ---------------- Generate via Claude API ---------------- */
document.getElementById('generateBtn').addEventListener('click', generateNote);

async function generateNote(){
  const errEl = document.getElementById('genError');
  errEl.style.display = 'none';

  if(!state.category){ errEl.textContent = 'Choisissez une catégorie.'; errEl.style.display='block'; return; }
  const subject = document.getElementById('subjectInput').value.trim();
  if(!subject){ errEl.textContent = 'Décrivez le sujet de la note.'; errEl.style.display='block'; return; }

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Génération…';

  const keyPoints = document.getElementById('keyPoints').value.trim();
  const to = computeTo();
  if(!to){ errEl.textContent = 'Sélectionnez au moins un destinataire.'; errEl.style.display='block'; btn.disabled=false; btn.textContent='Générer la note'; return; }
  const ref = document.getElementById('refInput').value.trim() || nextRef();

  const skeleton = state.category.sections;

  const systemPrompt = `Tu rédiges des notes de service internes pour une compagnie aérienne. ${STYLE_REFERENCE}

Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant/après, sans balises markdown, au format exact :
{
  "objet": "phrase d'objet complète, précise, en une ou deux lignes",
  "intro": "paragraphe d'introduction (3-5 phrases) situant le contexte et le but de la note",
  "sections": [
    {"title": "Titre section 1", "content": "contenu détaillé, plusieurs phrases et/ou puces avec •"},
    ...
  ]
}

La note doit obligatoirement comporter ces sections, dans cet ordre, avec des titres identiques ou très proches : ${skeleton.join(' / ')}.
Chaque section doit contenir un contenu substantiel (60 à 150 mots), concret et actionnable, pas de généralités vagues.

Format JSON strict : échappe tous les retours à la ligne en \\n et tous les guillemets internes en \\" à l'intérieur des chaînes. N'insère jamais un saut de ligne réel dans une valeur de chaîne — uniquement des \\n littéraux. N'utilise pas de guillemets typographiques (« », " ") à l'intérieur du JSON, seulement des guillemets droits échappés si nécessaire.`;

  const userPrompt = `Sujet de la note : ${subject}
Catégorie : ${state.category.label}
${keyPoints ? 'Points clés à intégrer impérativement :\n' + keyPoints : ''}`;

  try{
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        max_tokens: 4000,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });
    const data = await response.json();
    if(!response.ok){
      throw new Error(data.error?.message || data.error || 'Erreur API');
    }
    const raw = (data.content || []).map(b => b.text || '').join('\n');
    let clean = raw.replace(/```json|```/g, '').trim();
    let parsed;
    try{
      parsed = JSON.parse(clean);
    }catch(parseErr){
      // Fallback: the model sometimes emits literal newlines inside JSON string
      // values instead of escaped \n, which breaks strict JSON.parse. Repair by
      // escaping raw control characters that occur *inside* quoted strings.
      let repaired = '';
      let inString = false;
      let prevChar = '';
      for(const ch of clean){
        if(ch === '"' && prevChar !== '\\'){ inString = !inString; repaired += ch; prevChar = ch; continue; }
        if(inString && (ch === '\n' || ch === '\r')){ repaired += '\\n'; prevChar = ch; continue; }
        repaired += ch;
        prevChar = ch;
      }
      parsed = JSON.parse(repaired);
    }

    state.ref = ref;
    state.date = new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric'});
    state.to = to;
    state.objet = parsed.objet || '';
    state.intro = parsed.intro || '';
    state.sections = parsed.sections || [];
    state.closingText = state.closing;

    renderSheet();
  }catch(e){
    errEl.textContent = 'Erreur de génération : ' + (e.message || 'réessayez.');
    errEl.style.display = 'block';
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.textContent = 'Générer la note';
  }
}

/* ---------------- Render editable sheet ---------------- */
function renderSheet(){
  document.getElementById('emptyState').style.display = 'none';
  const sheet = document.getElementById('sheet');
  sheet.style.display = 'block';

  sheet.innerHTML = `
    <div class="sheet-head">
      <span><b>SAHARA AVIATION SAS — AFRIJET SAHARA</b> · Direction des Opérations Aériennes</span>
      <span>${state.ref} · Document interne</span>
    </div>
    <div class="doc-title">
      <div class="t1">NOTE DE SERVICE</div>
      <div class="t2">SERVICE MEMORANDUM — FORMAT INTERNATIONAL (ICAO Annex 6 / EASA Part-OPS)</div>
    </div>
    <table class="meta-table">
      <tr>
        <td style="width:50%"><span class="k">Réf. / Ref.</span><span contenteditable data-field="ref">${state.ref}</span></td>
        <td style="width:50%"><span class="k">Date</span><span contenteditable data-field="date">${state.date}</span></td>
      </tr>
      <tr>
        <td><span class="k">De / From</span><span contenteditable data-field="from">${state.from}</span></td>
        <td><span class="k">Classification</span><span contenteditable data-field="classification">${state.classification}</span></td>
      </tr>
      <tr>
        <td><span class="k">À / To</span><span contenteditable data-field="to">${state.to}</span></td>
        <td><span class="k">Révision</span><span contenteditable data-field="revision">${state.revision}</span></td>
      </tr>
    </table>
    <div class="objet-block">
      <span class="lbl">OBJET :</span>
      <div contenteditable data-field="objet">${state.objet}</div>
    </div>
    <div class="intro" contenteditable data-field="intro">${state.intro}</div>
    <div id="sectionsHost"></div>
    <div class="closing" contenteditable data-field="closing">${state.closingText || state.closing}</div>
    <div class="sign-block">
      <div>Émis par :<div class="role">Direction des Opérations Aériennes<br>Sahara Aviation SAS — Afrijet Sahara</div></div>
      <div style="text-align:right;">Approuvé par :<div class="role">Commandant de Bord / Directeur des Opérations Aériennes</div></div>
    </div>
  `;

  const host = sheet.querySelector('#sectionsHost');
  state.sections.forEach((sec, i)=>{
    const div = document.createElement('div');
    div.className = 'section-block';
    div.innerHTML = `<h3 contenteditable data-sec-title="${i}">${sec.title}</h3>
      <div contenteditable data-sec-content="${i}">${sec.content}</div>`;
    host.appendChild(div);
  });

  const actions = document.createElement('div');
  actions.className = 'sheet-actions';
  actions.innerHTML = `
    <button class="btn-secondary" id="saveBtn">Enregistrer dans les archives</button>
    <button class="btn-primary" id="pdfBtn" style="padding:11px 20px;">Télécharger le PDF</button>
  `;
  sheet.after(actions);
  document.getElementById('saveBtn').onclick = saveToArchive;
  document.getElementById('pdfBtn').onclick = exportPDF;

  sheet.querySelectorAll('[contenteditable]').forEach(el=>{
    el.addEventListener('blur', syncStateFromDOM);
  });
}

function syncStateFromDOM(){
  const sheet = document.getElementById('sheet');
  const get = sel => sheet.querySelector(sel)?.innerText.trim() || '';
  state.ref = get('[data-field="ref"]');
  state.date = get('[data-field="date"]');
  state.from = get('[data-field="from"]');
  state.revision = get('[data-field="revision"]');
  state.to = get('[data-field="to"]');
  state.classification = get('[data-field="classification"]');
  state.objet = get('[data-field="objet"]');
  state.intro = get('[data-field="intro"]');
  state.closingText = get('[data-field="closing"]');
  state.sections = state.sections.map((sec,i)=>({
    title: get(`[data-sec-title="${i}"]`) || sec.title,
    content: get(`[data-sec-content="${i}"]`) || sec.content
  }));
}

/* ---------------- Archive (localStorage) ---------------- */
function saveToArchive(){
  syncStateFromDOM();
  const archive = JSON.parse(localStorage.getItem('ns:archive') || '[]');
  const record = {
    id: state.ref + '-' + Date.now(),
    ...state,
    category: state.category ? state.category.label : '',
    savedAt: new Date().toISOString()
  };
  archive.unshift(record);
  localStorage.setItem('ns:archive', JSON.stringify(archive));
  commitRefCounter();
  document.getElementById('refInput').value = nextRef();
  alert('Note enregistrée dans les archives : ' + record.ref);
  renderArchiveList();
}

function loadFromArchive(record){
  state = { ...record, category: CATEGORIES.find(c=>c.label===record.category) || null };
  switchTab('editor');
  renderSheet();
}

function deleteFromArchive(id){
  if(!confirm('Supprimer cette note des archives ?')) return;
  let archive = JSON.parse(localStorage.getItem('ns:archive') || '[]');
  archive = archive.filter(r=>r.id!==id);
  localStorage.setItem('ns:archive', JSON.stringify(archive));
  renderArchiveList();
}

function renderArchiveList(filter=''){
  const list = document.getElementById('archiveList');
  const archive = JSON.parse(localStorage.getItem('ns:archive') || '[]');
  const f = filter.toLowerCase();
  const filtered = archive.filter(r =>
    (r.ref||'').toLowerCase().includes(f) ||
    (r.objet||'').toLowerCase().includes(f) ||
    (r.category||'').toLowerCase().includes(f)
  );
  if(filtered.length===0){
    list.innerHTML = `<div class="archive-empty">Aucune note archivée${filter?' pour cette recherche':''}.</div>`;
    return;
  }
  list.innerHTML = '';
  filtered.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'archive-row';
    row.innerHTML = `
      <div>
        <div class="ref">${r.ref}</div>
        <div class="obj">${r.objet || '(sans objet)'}</div>
        <div class="meta">${r.category} · ${r.date}</div>
      </div>
      <div class="actions">
        <button data-act="open">Ouvrir</button>
        <button data-act="pdf">PDF</button>
        <button data-act="del">Supprimer</button>
      </div>
    `;
    row.querySelector('[data-act="open"]').onclick = (e)=>{ e.stopPropagation(); loadFromArchive(r); };
    row.querySelector('[data-act="pdf"]').onclick = (e)=>{ e.stopPropagation(); state = {...r, category: CATEGORIES.find(c=>c.label===r.category)}; exportPDF(); };
    row.querySelector('[data-act="del"]').onclick = (e)=>{ e.stopPropagation(); deleteFromArchive(r.id); };
    list.appendChild(row);
  });
}

document.getElementById('archiveSearch').addEventListener('input', e=>renderArchiveList(e.target.value));

/* ---------------- Tabs ---------------- */
function switchTab(tab){
  document.getElementById('tabEditor').classList.toggle('active', tab==='editor');
  document.getElementById('tabArchive').classList.toggle('active', tab==='archive');
  document.getElementById('editorAside').style.display = tab==='editor' ? 'flex' : 'none';
  document.getElementById('workspace').style.display = tab==='editor' ? 'flex' : 'none';
  document.getElementById('archivePanel').style.display = tab==='archive' ? 'block' : 'none';
  if(tab==='archive') renderArchiveList(document.getElementById('archiveSearch').value);
}
document.getElementById('tabEditor').onclick = ()=>switchTab('editor');
document.getElementById('tabArchive').onclick = ()=>switchTab('archive');

/* ---------------- PDF export (replicates NS-OPS template) ---------------- */
function exportPDF(){
  syncStateFromDOM();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const marginX = 20;
  const pageWidth = 210;
  const pageHeight = 297;
  const contentWidth = pageWidth - marginX*2;
  let y = 0;
  let page = 1;

  function drawHeader(){
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.setTextColor(26,26,46);
    const brand = 'SAHARA AVIATION SAS — AFRIJET SAHARA';
    doc.text(brand, marginX, 11);
    const brandWidth = doc.getTextWidth(brand);
    doc.setFont('helvetica','normal');
    doc.setTextColor(90,90,100);
    doc.text('   Direction des Opérations Aériennes', marginX + brandWidth, 11);

    doc.setFontSize(8);
    doc.text(`${state.ref} — Diffusion : PNT / Encadrement opérationnel — Document interne`, marginX, 16);
    doc.text(`Page ${page}`, pageWidth - marginX, 16, { align: 'right' });

    doc.setDrawColor(139,0,0);
    doc.setLineWidth(0.4);
    doc.line(marginX, 18.5, pageWidth - marginX, 18.5);
    y = 28;
  }

  function newPage(){
    doc.addPage();
    page++;
    drawHeader();
  }

  function checkSpace(needed){
    if(y + needed > pageHeight - 18){
      newPage();
    }
  }

  function writeParagraph(text, opts={}){
    const fontSize = opts.fontSize || 10.5;
    const lineHeight = opts.lineHeight || 5.2;
    const bold = opts.bold || false;
    doc.setFont('times', bold ? 'bold' : 'normal');
    doc.setFontSize(fontSize);
    doc.setTextColor(26,26,46);
    const lines = doc.splitTextToSize(text, contentWidth);
    lines.forEach(line=>{
      checkSpace(lineHeight);
      doc.text(line, marginX, y);
      y += lineHeight;
    });
  }

  function writeSectionTitle(text){
    y += 3;
    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.setTextColor(26,26,46);
    doc.text(text.toUpperCase(), marginX, y);
    y += 7.5;
  }

  // Ensures a section title is never left alone at the bottom of a page:
  // reserves room for the title block PLUS at least the first couple of
  // content lines before deciding whether to break to a new page.
  function writeSection(title, content, opts={}){
    const fontSize = opts.fontSize || 10.3;
    const lineHeight = opts.lineHeight || 5;
    doc.setFont('times', 'normal');
    doc.setFontSize(fontSize);
    const contentLines = doc.splitTextToSize(content, contentWidth);
    const titleBlockHeight = 3 + 7.5; // gap + title
    const minOrphanLines = Math.min(2, contentLines.length);
    const reserved = titleBlockHeight + (minOrphanLines * lineHeight);
    checkSpace(reserved);
    writeSectionTitle(title);
    writeParagraph(content, { fontSize, lineHeight });
  }

  drawHeader();

  // Title block
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.setTextColor(26,26,46);
  doc.text('NOTE DE SERVICE', pageWidth/2, y, { align:'center' });
  y += 5.5;
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(90,90,100);
  doc.text('SERVICE MEMORANDUM — FORMAT INTERNATIONAL (ICAO Annex 6 / EASA Part-OPS)', pageWidth/2, y, { align:'center' });
  y += 9;

  // Meta table
  const rows = [
    ['Réf. / Ref.', state.ref, 'Date', state.date],
    ['De / From', state.from, 'Classification', state.classification],
    ['À / To', state.to, 'Révision', state.revision]
  ];
  doc.setFontSize(8.7);
  const colW = contentWidth/2;
  rows.forEach(([k1,v1,k2,v2])=>{
    const h1 = doc.splitTextToSize(v1, colW - 26).length * 4 + 3;
    const h2 = doc.splitTextToSize(v2, colW - 26).length * 4 + 3;
    const rowH = Math.max(h1, h2, 10);
    checkSpace(rowH);
    doc.setDrawColor(180,175,165);
    doc.setLineWidth(0.15);
    doc.rect(marginX, y, colW, rowH);
    doc.rect(marginX+colW, y, colW, rowH);
    doc.setFont('helvetica','bold');
    doc.setFontSize(7);
    doc.setTextColor(120,115,110);
    doc.text(k1.toUpperCase(), marginX+3, y+4);
    doc.text(k2.toUpperCase(), marginX+colW+3, y+4);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9);
    doc.setTextColor(26,26,46);
    doc.text(doc.splitTextToSize(v1, colW-6), marginX+3, y+8.5);
    doc.text(doc.splitTextToSize(v2, colW-6), marginX+colW+3, y+8.5);
    y += rowH;
  });
  y += 8;

  // Objet (label + at least its first line must stay together)
  doc.setFont('times', 'bold');
  doc.setFontSize(11.5);
  const objetLines = doc.splitTextToSize(state.objet, contentWidth);
  checkSpace(5 + 5 + 5.6);
  doc.setFont('helvetica','bold');
  doc.setFontSize(9.5);
  doc.setTextColor(26,26,46);
  doc.text('OBJET :', marginX, y);
  y += 5;
  writeParagraph(state.objet, { fontSize: 11.5, lineHeight: 5.6, bold: true });
  y += 4;

  // Intro
  writeParagraph(state.intro, { fontSize: 10.3, lineHeight: 5 });
  y += 4;

  // Sections
  state.sections.forEach((sec, i)=>{
    writeSection(`${i+1}. ${sec.title}`, sec.content, { fontSize: 10.3, lineHeight: 5 });
    y += 5;
  });

  // Closing
  y += 2;
  doc.setFont('times','normal');
  doc.setFontSize(9.8);
  doc.setTextColor(26,26,46);
  const closingLines = doc.splitTextToSize(state.closingText || state.closing, contentWidth);
  closingLines.forEach(line=>{ checkSpace(5); doc.text(line, marginX, y); y+=5; });

  // Signatures
  checkSpace(28);
  y += 10;
  doc.setDrawColor(180,175,165);
  doc.line(marginX, y, marginX + 70, y);
  doc.line(pageWidth - marginX - 70, y, pageWidth - marginX, y);
  y += 5;
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(26,26,46);
  doc.text('Émis par :', marginX, y);
  doc.text('Approuvé par :', pageWidth - marginX - 70, y);
  y += 4.5;
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.8);
  doc.setTextColor(100,95,95);
  doc.text('Direction des Opérations Aériennes\nSahara Aviation SAS — Afrijet Sahara', marginX, y);
  doc.text('Commandant de Bord / Directeur\ndes Opérations Aériennes', pageWidth - marginX - 70, y);

  doc.save(`${state.ref}.pdf`);
}
</script>
